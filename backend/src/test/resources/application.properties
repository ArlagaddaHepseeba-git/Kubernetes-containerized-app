# =====================
# Test profile
# =====================
# Runs the full application context against an in-memory H2 database so
# `mvn test` works on any machine without MySQL installed. The CI pipeline
# depends on this: without it the test fails at context load with
# "Unable to determine Dialect without JDBC metadata".
#
# Activate automatically for tests via src/test/resources/application.properties
# =====================

# Server: no SSL, no second connector during tests
server.ssl.enabled=false
server.port=0

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: create the schema from the entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Actuator stays available so probe paths can be tested.
# The prometheus endpoint needs micrometer-registry-prometheus on the
# classpath, which the main pom declares - but WAR packaging with a
# provided-scope Tomcat can leave the registry out of the test slice, so
# the endpoint is asserted explicitly to catch that regression.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# The Prometheus scrape endpoint is only registered when this export is
# explicitly enabled alongside the registry on the classpath.
management.prometheus.metrics.export.enabled=true

# No database is listening during tests, so the db health indicator would
# report DOWN and fail every readiness assertion. Disable it here only.
management.health.db.enabled=false
