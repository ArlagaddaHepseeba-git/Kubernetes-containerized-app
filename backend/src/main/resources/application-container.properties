# =====================
# Container profile
# =====================
# Activate with: SPRING_PROFILES_ACTIVE=container
#
# Used by Docker and Kubernetes. Differences from the default profile:
#   - SSL disabled: TLS is terminated by Nginx (local compose) or the
#     AWS ALB (Kubernetes), never by the application itself
#   - No second HTTP connector: one plain connector on 8080
#   - Database credentials come from environment variables
#   - Actuator health groups enabled for Kubernetes probes
# =====================

server.ssl.enabled=false
server.port=${PORT:8080}

# Database - always from environment, no defaults in a container
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =====================
# Kubernetes probes
# =====================
# liveness  -> /actuator/health/liveness
# readiness -> /actuator/health/readiness
# Exposing these as separate health groups is what lets Kubernetes tell
# "restart this pod" apart from "stop routing traffic to this pod".
# =====================
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# Database health is part of readiness: a pod with no database
# should not receive traffic.
management.health.db.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Metrics for Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Required for /actuator/prometheus to be registered. Without this the
# Prometheus scrape target fails with 404 even though the pod is healthy.
management.prometheus.metrics.export.enabled=true

management.metrics.tags.application=${spring.application.name:three-tier-backend}
