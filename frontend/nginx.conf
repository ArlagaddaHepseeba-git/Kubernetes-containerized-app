server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React static build
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to the Spring Boot backend
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health probe endpoint for Docker and Kubernetes
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
        echo ok;
    }

    # Hashed build assets can be cached aggressively
    location ~* \.(js|css|woff2|woff|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
