# MySQL init script, mounted into /docker-entrypoint-initdb.d.
# The MySQL official image runs any .sql file in that directory exactly
# once, on first start of an empty data directory. This is what creates
# the schema the backend expects, so the app does not crash on its first
# query with "table items doesn't exist".
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS devops_practice_db;
    USE devops_practice_db;

    CREATE TABLE IF NOT EXISTS items (
        id         BIGINT       NOT NULL AUTO_INCREMENT,
        name       VARCHAR(255) NOT NULL,
        created_at TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    CREATE TABLE IF NOT EXISTS users (
        id            BIGINT       NOT NULL AUTO_INCREMENT,
        username      VARCHAR(100) NOT NULL UNIQUE,
        email         VARCHAR(255) NOT NULL UNIQUE,
        password_hash VARCHAR(255) NOT NULL,
        created_at    TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    INSERT INTO items (name) VALUES
        ('Learn Docker'),
        ('Setup Kubernetes'),
        ('Configure CI/CD'),
        ('Deploy to AWS'),
        ('Monitor with Prometheus'),
        ('Practice Terraform'),
        ('Write a GitHub Action');
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # Local-cluster placeholder only. In a real environment these are
  # synced from AWS Secrets Manager by the External Secrets Operator,
  # so no password is ever stored in git. See README.
  DB_USERNAME: "root"
  DB_PASSWORD: "local-dev-password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_URL: "jdbc:mysql://mysql:3306/devops_practice_db"
  PORT: "8080"
  # "container" is required in Kubernetes: it disables TLS (the Ingress
  # terminates it) and enables the liveness/readiness health groups that
  # the probes below depend on.
  SPRING_PROFILES_ACTIVE: "container"
